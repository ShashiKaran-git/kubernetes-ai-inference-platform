apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-inference-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-inference-api

  template:
    metadata:
      labels:
        app: ai-inference-api

    spec:
      containers:
        - name: ai-inference-api
          image: ai-inference-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          resources:
            requests:
             memory: "128Mi"
             cpu: "100m"

            limits:
             memory: "256Mi"
             cpu: "250m"